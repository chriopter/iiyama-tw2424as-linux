# Wallpanel: mDNS only for the AirPlay announcement (wallpanel-airplay), only on the LAN interfaces.
# usb0 (maintenance link) is left out. Replaces the file of the avahi package.
[server]
allow-interfaces=wlan0,eth0
use-ipv4=yes
use-ipv6=yes
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
publish-hinfo=no
publish-workstation=no
disable-user-service-publishing=no

[reflector]
enable-reflector=no

[rlimits]
