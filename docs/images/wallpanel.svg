<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" fill="none">
  <title>Wall-mounted touch panel with a smart-home dashboard</title>
  <desc>A slim white 24-inch landscape panel on a light wall. Its dark 16:9 screen displays lighting, temperature, energy, weather and media controls.</desc>
  <defs>
    <linearGradient id="wall" x1="600" y1="0" x2="600" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F6F3"/><stop offset="1" stop-color="#E8ECE8"/>
    </linearGradient>
    <radialGradient id="shadow">
      <stop stop-color="#263C35" stop-opacity=".23"/><stop offset=".72" stop-color="#263C35" stop-opacity=".08"/><stop offset="1" stop-color="#263C35" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bezel" x1="600" y1="110" x2="600" y2="644" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9EDEB"/>
    </linearGradient>
    <linearGradient id="screen" x1="168" y1="137" x2="1032" y2="623" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E2B30"/><stop offset="1" stop-color="#101B21"/>
    </linearGradient>
  </defs>

  <!-- Wall, diffuse contact shadow and shallow enclosure. -->
  <path fill="url(#wall)" d="M0 0h1200v760H0z"/>
  <ellipse cx="606" cy="632" rx="509" ry="81" fill="url(#shadow)"/>
  <rect x="145" y="126" width="916" height="532" rx="33" fill="#72817A" opacity=".035"/>
  <rect x="150" y="127" width="906" height="525" rx="29" fill="#72817A" opacity=".07"/>
  <rect x="151" y="119" width="900" height="529" rx="27" fill="#C8D0CC"/>
  <rect x="150" y="113" width="900" height="530" rx="27" fill="url(#bezel)" stroke="#FFFFFF" stroke-width="2"/>
  <!-- The visible screen is exactly 864 × 486, or 16:9. -->
  <rect x="166" y="135" width="868" height="490" rx="15" fill="#0C1418"/>
  <rect x="168" y="137" width="864" height="486" rx="13" fill="url(#screen)"/>
  <rect x="579" y="631" width="42" height="3" rx="1.5" fill="#CBD3D0"/>

  <g font-family="sans-serif">
    <!-- Dashboard top bar. -->
    <rect x="192" y="157" width="34" height="34" rx="11" fill="#34453F"/>
    <g stroke="#B7DDBB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m201 173 8-7 8 7M203 172v10h12v-10M207 182v-6h4v6"/>
    </g>
    <text x="238" y="180" fill="#F1F5F2" font-size="19" font-weight="600">Wohnzimmer</text>
    <circle cx="850" cy="174" r="3" fill="#B6DCBB"/>
    <text x="861" y="178" fill="#A9B8BB" font-size="12">Zuhause</text>
    <path d="M930 163v22" stroke="#3A484D"/>
    <text x="950" y="180" fill="#E1E9E8" font-size="17">18:42</text>
    <path d="M192 205h816" stroke="#354249" stroke-opacity=".65"/>

    <!-- Lighting: warm ivory card, large touch target and dimmer. -->
    <rect x="192" y="224" width="254" height="219" rx="18" fill="#E9EAD9"/>
    <circle cx="226" cy="258" r="17" fill="#DADFC7"/>
    <g stroke="#4B604B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M221 262c0-3-3-4-3-8a8 8 0 0 1 16 0c0 4-3 5-3 8zM222 266h8M224 269h4"/>
    </g>
    <text x="253" y="264" fill="#33453B" font-size="16" font-weight="600">Licht</text>
    <rect x="389" y="249" width="36" height="21" rx="10.5" fill="#658063"/>
    <circle cx="414" cy="259.5" r="7.5" fill="#F8FAEF"/>
    <text x="213" y="333" fill="#2E4438" font-size="44" font-weight="500">72<tspan font-size="21" fill="#647560"> %</tspan></text>
    <text x="214" y="360" fill="#657560" font-size="13">Helligkeit</text>
    <rect x="214" y="391" width="210" height="7" rx="3.5" fill="#C9D0BC"/>
    <rect x="214" y="391" width="151" height="7" rx="3.5" fill="#708965"/>
    <circle cx="365" cy="395" r="12" fill="#445D45" opacity=".12"/>
    <circle cx="365" cy="394" r="10" fill="#FCFCF3" stroke="#849575" stroke-width="2"/>

    <!-- Thermostat. -->
    <rect x="460" y="224" width="260" height="219" rx="18" fill="#29373D" stroke="#3B494F" stroke-opacity=".6"/>
    <text x="481" y="264" fill="#E3EBE9" font-size="16" font-weight="600">Temperatur</text>
    <circle cx="691" cy="257" r="4" fill="#DFBD8D"/>
    <path d="M539 389a67 67 0 1 1 102 0" stroke="#425157" stroke-width="8" stroke-linecap="round"/>
    <path d="M539 389a67 67 0 1 1 106-5" stroke="#DFC092" stroke-width="8" stroke-linecap="round"/>
    <circle cx="645" cy="384" r="5.5" fill="#FFF2DA"/>
    <text x="590" y="358" text-anchor="middle" fill="#F4EEE4" font-size="43" font-weight="500">21°</text>
    <text x="590" y="382" text-anchor="middle" fill="#ACB9BC" font-size="12">Raumtemperatur</text>
    <path d="M536 415h10M634 415h10M639 410v10" stroke="#B6C2C3" stroke-width="1.6" stroke-linecap="round"/>
    <text x="590" y="419" text-anchor="middle" fill="#DFC092" font-size="12">Auto</text>

    <!-- Weather. -->
    <rect x="734" y="224" width="274" height="219" rx="18" fill="#2B3C47" stroke="#41525D" stroke-opacity=".6"/>
    <text x="755" y="264" fill="#E5ECF0" font-size="16" font-weight="600">Wetter</text>
    <g stroke="#E2C58D" stroke-width="2" stroke-linecap="round">
      <circle cx="952" cy="309" r="15" fill="#E2C58D" stroke="none"/>
      <path d="M952 284v-5M952 339v-5M927 309h-5M982 309h-5M934 291l-4-4M974 331l-4-4M970 291l4-4"/>
    </g>
    <path d="M924 338a12 12 0 0 1 0-24 19 19 0 0 1 36-1 12.5 12.5 0 1 1 4 25z" fill="#C1D4DD"/>
    <text x="755" y="337" fill="#EDF3F5" font-size="43">18°</text>
    <text x="756" y="362" fill="#B5C5CD" font-size="13">Leicht bewölkt</text>
    <path d="M755 383h232" stroke="#465965"/>
    <text x="755" y="414" fill="#BCD0DB" font-size="12">Heute</text>
    <text x="987" y="414" text-anchor="end" fill="#D7E3E9" font-size="13">14° / 20°</text>

    <!-- Energy flow: solar generation, home and grid. -->
    <rect x="192" y="457" width="528" height="143" rx="18" fill="#25353A" stroke="#39494F" stroke-opacity=".6"/>
    <text x="213" y="488" fill="#E3EBE9" font-size="16" font-weight="600">Energie</text>
    <circle cx="617" cy="482" r="3" fill="#AACFAF"/>
    <text x="628" y="487" fill="#AACFAF" font-size="11">Solar aktiv</text>
    <path d="M279 537h131" stroke="#D7BB83" stroke-width="3" stroke-linecap="round"/>
    <path d="M464 537h151" stroke="#87B7C4" stroke-width="3" stroke-linecap="round"/>
    <path d="m346 533 5 4-5 4" stroke="#F4DBA9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m540 533 5 4-5 4" stroke="#B9E2EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="344" y="522" text-anchor="middle" fill="#D9C79F" font-size="11">2,4 kW</text>
    <text x="540" y="522" text-anchor="middle" fill="#9AC5CF" font-size="11">0,8 kW</text>
    <circle cx="254" cy="537" r="25" fill="#3D433C"/>
    <g stroke="#E1C58D" stroke-width="1.8" stroke-linecap="round">
      <circle cx="254" cy="537" r="7"/>
      <path d="M254 525v-3M254 552v-3M242 537h-3M269 537h-3M245 528l-2-2M265 548l-2-2M263 528l2-2M245 546l-2 2"/>
    </g>
    <circle cx="437" cy="537" r="27" fill="#3B5148"/>
    <g stroke="#B7D9BC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m424 535 13-11 13 11M427 533v16h20v-16M434 549v-9h6v9"/>
    </g>
    <circle cx="640" cy="537" r="25" fill="#304953"/>
    <g stroke="#A3C8D4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="m631 550 6-26h6l6 26M630 533h20M633 528h14M628 539h24M635 539l12 11M645 539l-12 11"/>
    </g>
    <g fill="#A8BBBE" font-size="11" text-anchor="middle">
      <text x="254" y="581">Solar</text><text x="437" y="581">Zuhause</text><text x="640" y="581">Netz</text>
    </g>

    <!-- Media. -->
    <rect x="734" y="457" width="274" height="143" rx="18" fill="#303840" stroke="#444B54" stroke-opacity=".6"/>
    <rect x="755" y="477" width="44" height="44" rx="12" fill="#494C59"/>
    <g stroke="#C8BFDA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M773 506v-15l13-3v15M773 495l13-3"/>
      <ellipse cx="770" cy="507" rx="3" ry="2"/><ellipse cx="783" cy="504" rx="3" ry="2"/>
    </g>
    <text x="811" y="493" fill="#EBE8F1" font-size="15" font-weight="600">Musik</text>
    <text x="811" y="514" fill="#AEB3C0" font-size="12">Entspannen</text>
    <path d="m826 547-8 6 8 6zM815 547v12M916 547l8 6-8 6zM927 547v12" fill="#BFC3CE" stroke="#BFC3CE" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="871" cy="553" r="19" fill="#C7C0D9"/>
    <path d="M867 547v12M875 547v12" stroke="#343443" stroke-width="3" stroke-linecap="round"/>
    <rect x="755" y="582" width="232" height="3" rx="1.5" fill="#505361"/>
    <rect x="755" y="582" width="89" height="3" rx="1.5" fill="#B7ACCF"/>
  </g>
</svg>
